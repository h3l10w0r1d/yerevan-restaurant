# Render blueprint: the whole site (public site, admin and API) as one Docker service.
services:
  - type: web
    name: yerevan
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ADMIN_EMAIL
        value: info@yerevanrestaurant.nl
      - key: SITE_URL
        value: https://www.yerevanrestaurant.nl
      - key: ORDERING_ENABLED
        value: "false"
